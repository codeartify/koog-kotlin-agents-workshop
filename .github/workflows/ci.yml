name: CI

on:
  push:
    branches:
      - main
      - solutions
  pull_request:
    branches:
      - main
      - solutions

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check Docker
        run: docker version

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and run tests
        run: ./mvnw -B -ntp -Ddocker.compose.skip=true clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: staff_console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: staff_console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build staff console
        run: npm run build
