services:
  identity-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d identity"]
      interval: 5s
      timeout: 5s
      retries: 20

  fitness-management-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: fitness-management
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d fitness-management"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:latest
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  identity:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: identity
        ARTIFACT_ID: identity
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identity
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
    ports:
      - "8082:8082"
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fitness-management-system:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: fitness_management_system
        ARTIFACT_ID: fitness-management-system
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fitness-management-db:5432/fitness-management
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      AI_KOOG_GOOGLE_ENABLED: ${AI_KOOG_GOOGLE_ENABLED:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      fitness-management-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  staff-console:
    build:
      context: staff_console
    ports:
      - "4200:80"
    depends_on:
      - fitness-management-system
